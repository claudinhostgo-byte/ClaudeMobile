<title>Los Cambios de la Bici</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: the 16:9 film fills the width, controls sit under it. */
:root { --page:#E9F5FA; --ink:#1D2B3A; --dim:#4A5B6B; --btn:#E8483B; --btnInk:#ffffff; --track:#BFD3DD; --frame:#1D2B3A }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page:#0F1820; --ink:#E6F0F5; --dim:#9DB0BE; --btn:#E8483B; --btnInk:#ffffff; --track:#2C3B48; --frame:#000000; color-scheme:dark } }
:root[data-theme="dark"] { --page:#0F1820; --ink:#E6F0F5; --dim:#9DB0BE; --btn:#E8483B; --btnInk:#ffffff; --track:#2C3B48; --frame:#000000; color-scheme:dark }
html, body { background:var(--page); color:var(--ink) }
body { font-family:"Pixelify Sans", ui-monospace, monospace; padding-block:20px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:14px }
h1 { margin:0; font-family:"Pixelify Sans", ui-monospace, monospace; font-size:clamp(22px, 4vw, 32px); text-wrap:balance }
.screen { position:relative; width:100%; aspect-ratio:16/9; max-width:100%; overflow:hidden; border-radius:14px; background:var(--frame); cursor:pointer }
#stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden; --display:"Pixelify Sans", monospace; --sans:"Pixelify Sans", monospace }
#stage > .sc { position:absolute; inset:0 }
.big { position:absolute; inset:0; margin:auto; width:110px; height:110px; border-radius:50%; border:0; background:var(--btn); color:var(--btnInk); font-size:44px; box-shadow:0 6px 24px rgba(0,0,0,.3); cursor:pointer }
.bar { display:flex; align-items:center; gap:12px }
.bar button { flex:none; min-width:48px; height:48px; border-radius:24px; border:0; background:var(--btn); color:var(--btnInk); font:700 18px "Pixelify Sans", ui-monospace, monospace; padding:0 16px; cursor:pointer }
.bar input { flex:1; min-width:0; accent-color:var(--btn) }
.time { font-variant-numeric:tabular-nums; color:var(--dim); font-weight:700; min-width:88px; text-align:right }
button:focus-visible, input:focus-visible { outline:3px solid var(--ink); outline-offset:2px }
p.note { margin:0; color:var(--dim); font-size:15px; max-width:65ch }
#stage { --ground:#BFE6F5; --main:#E8483B; --second:#1D2B3A; --accent:#FFC93C; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }
#stage { --far:color-mix(in srgb, var(--ground) 70%, var(--second)); --grass:color-mix(in srgb, color-mix(in srgb, var(--ground) 45%, var(--accent)) 74%, var(--second)); --grass2:color-mix(in srgb, var(--grass) 78%, var(--second)); --road:color-mix(in srgb, var(--second) 72%, var(--ground));
  --steel:color-mix(in srgb, var(--second) 62%, var(--ground)); --metal:color-mix(in srgb, var(--ground) 70%, var(--second)); --metal2:color-mix(in srgb, var(--ground) 50%, var(--second)); --tire:color-mix(in srgb, var(--second) 92%, var(--main));
  --cloud:color-mix(in srgb, var(--ground) 28%, #ffffff); --card:color-mix(in srgb, var(--ground) 30%, #ffffff); --trunk:color-mix(in srgb, var(--main) 45%, var(--second)) }
.ground { position:absolute; inset:0; background:var(--ground) }
.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:20px } .words > * { margin:0 }
.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:96px; line-height:1.08; font-weight:700 } .sub { font-size:56px; line-height:1.2; font-weight:700 }
.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }
.air { position:absolute; inset:0; background:linear-gradient(color-mix(in srgb, var(--ground) 82%, var(--second)), var(--ground) 70%) }
.band { left:0; right:0; bottom:0; padding:34px 110px 50px; background:var(--card); border-top:10px solid var(--accent); gap:10px }
.band .sub { font-size:58px } .band .em { color:var(--main) }
.tag { position:absolute; padding:10px 28px; border-radius:40px; background:var(--card); border:5px solid var(--second); font-size:46px; font-weight:800; line-height:1.15 }
.count { position:absolute; right:80px; top:70px; width:430px; padding:26px 36px; background:var(--card); border-radius:28px; border:5px solid var(--second); display:flex; flex-direction:column; gap:14px }
.count .row { display:flex; justify-content:space-between; align-items:center; gap:20px; font-size:42px; font-weight:800 }
.count .n { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:88px; line-height:1; color:var(--main); font-variant-numeric:tabular-nums; font-weight:700 }/* Estilo bloques: todo se dibuja en pixeles de 10 px sobre el escenario de 1920. */
#stage { --display:"Pixelify Sans", ui-monospace, monospace; --sans:"Pixelify Sans", ui-monospace, monospace;
  --grass:#5FB548; --grass2:#3E8E35; --trunk:#7A5232; --far:#8CC3D6; --road:#8B7355; --cloud:#F4FAFD; --card:#F4FAFD }
#stage .art > g, #stage .art > path, #stage .art > rect, #stage .art > ellipse { filter:url(#px) }
#stage .air { background:linear-gradient(#7FC4E8, var(--ground) 70%) }
#stage .tag, #stage .count { border-radius:0; border-width:6px; box-shadow:10px 10px 0 var(--second) }
#stage .band { border-top:14px solid var(--grass); box-shadow:inset 0 10px 0 var(--grass2) }
#stage .line, #stage .count .n { font-weight:700; letter-spacing:.01em }
#stage .sub, #stage .tag, #stage .count .row { font-weight:500 }
.screen, .bar button, .big { border-radius:0 !important }
.big { box-shadow:8px 8px 0 rgba(0,0,0,.35) !important }

</style>

<script>
const DATA = {"scenes": [{"id": "intro", "name": "La bici", "dur": 3.5, "desc": "Una bici entra rodando por un camino y aparece la pregunta del t\u00edtulo."}, {"id": "chain", "name": "La cadena", "dur": 6, "desc": "De cerca: los pedales giran el plato, la cadena arrastra el pi\u00f1\u00f3n y la rueda gira."}, {"id": "easy", "name": "Pi\u00f1\u00f3n grande", "dur": 6, "desc": "Con el pi\u00f1\u00f3n grande, una vuelta de pedal da una vuelta de rueda: suave para subir."}, {"id": "fast", "name": "Pi\u00f1\u00f3n chico", "dur": 6, "desc": "Con el pi\u00f1\u00f3n chico, una vuelta de pedal da tres vueltas de rueda: m\u00e1s fuerza, m\u00e1s r\u00e1pido."}, {"id": "shift", "name": "El cambio", "dur": 5, "desc": "Al cambiar, la cadena salta de un pi\u00f1\u00f3n a otro mientras se pedalea."}, {"id": "end", "name": "A pedalear", "dur": 3.5, "desc": "La bici avanza por el camino con el resumen: grande para subir, chico para ir r\u00e1pido."}], "shared": "// A drawn bike workshop. Scenes stage these drawings.\nwindow.W = {\n  gearPath(r, n, h) {\n    const st = Math.PI * 2 / n, rb = r - h / 2, rt = r + h / 2; let d = '';\n    for (let i = 0; i < n; i++) {\n      const a = i * st, pts = [[a, rb], [a + st * 0.18, rt], [a + st * 0.5, rt], [a + st * 0.68, rb]];\n      for (const p of pts) d += (d ? 'L' : 'M') + (p[1] * Math.cos(p[0])).toFixed(1) + ' ' + (p[1] * Math.sin(p[0])).toFixed(1);\n    }\n    return d + 'Z';\n  },\n  // A toothed gear centred on (0,0). holes: the spider arms of a chainring.\n  gear(cls, r, n, fill, holes) {\n    let s = '<g class=\"' + cls + '\"><path d=\"' + W.gearPath(r, n, Math.min(16, r * 0.18)) + '\" style=\"fill:' + fill + ';stroke:var(--second);stroke-width:4;stroke-linejoin:round\"/>';\n    if (holes) {\n      s += '<circle r=\"' + (r * 0.72).toFixed(1) + '\" style=\"fill:color-mix(in srgb, var(--second) 22%, transparent)\"/>';\n      for (let i = 0; i < 5; i++) s += '<rect x=\"' + (-r * 0.09).toFixed(1) + '\" y=\"' + (-r * 0.74).toFixed(1) + '\" width=\"' + (r * 0.18).toFixed(1) + '\" height=\"' + (r * 0.74).toFixed(1) + '\" rx=\"6\" transform=\"rotate(' + (i * 72) + ')\" style=\"fill:' + fill + ';stroke:var(--second);stroke-width:3\"/>';\n    }\n    return s + '<circle r=\"' + Math.max(8, r * 0.2).toFixed(1) + '\" style=\"fill:var(--steel);stroke:var(--second);stroke-width:4\"/><\/g>';\n  },\n  // A spoked wheel centred on (0,0), with a yellow reflector so you can count its turns.\n  wheel(cls, R) {\n    const k = R / 150; let s = '<g class=\"' + cls + '\">';\n    s += '<circle r=\"' + (R - 12 * k) + '\" style=\"fill:none;stroke:var(--tire);stroke-width:' + (24 * k) + '\"/>';\n    s += '<circle r=\"' + (R - 27 * k) + '\" style=\"fill:none;stroke:var(--steel);stroke-width:' + (6 * k) + '\"/>';\n    for (let i = 0; i < 16; i++) {\n      const a = i * Math.PI / 8;\n      s += '<line x1=\"' + (14 * k * Math.cos(a)).toFixed(1) + '\" y1=\"' + (14 * k * Math.sin(a)).toFixed(1) + '\" x2=\"' + ((R - 28 * k) * Math.cos(a)).toFixed(1) + '\" y2=\"' + ((R - 28 * k) * Math.sin(a)).toFixed(1) + '\" style=\"stroke:var(--steel);stroke-width:' + (2.5 * k) + '\"/>';\n    }\n    s += '<rect x=\"' + (-9 * k) + '\" y=\"' + (-R * 0.66 - 15 * k) + '\" width=\"' + (18 * k) + '\" height=\"' + (30 * k) + '\" rx=\"' + (4 * k) + '\" style=\"fill:var(--accent);stroke:var(--second);stroke-width:' + (3 * k) + '\"/>';\n    return s + '<circle r=\"' + (18 * k) + '\" style=\"fill:var(--steel);stroke:var(--second);stroke-width:' + (3 * k) + '\"/><\/g>';\n  },\n  // The loop of chain around two gears (rear first), as one path that runs clockwise.\n  chain(x1, y1, r1, x2, y2, r2) {\n    const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy), th = Math.atan2(dy, dx), ph = Math.asin((r1 - r2) / d);\n    const at = th - Math.PI / 2 + ph, ab = th + Math.PI / 2 - ph;\n    const p = (x, y, r, a) => (x + r * Math.cos(a)).toFixed(1) + ' ' + (y + r * Math.sin(a)).toFixed(1);\n    return 'M' + p(x1, y1, r1, at) + ' L' + p(x2, y2, r2, at) + ' A' + r2 + ' ' + r2 + ' 0 ' + (r2 > r1 ? 1 : 0) + ' 1 ' + p(x2, y2, r2, ab) + ' L' + p(x1, y1, r1, ab) + ' A' + r1 + ' ' + r1 + ' 0 ' + (r1 > r2 ? 1 : 0) + ' 1 ' + p(x1, y1, r1, at) + 'Z';\n  },\n  hills() {\n    return '<path class=\"hills\" d=\"M0 650 Q260 520 620 600 T1300 570 T1920 545 V900 H0 Z\" style=\"fill:var(--far)\"/>';\n  },\n  // A row of round trees, drawn twice side by side so it can loop as it scrolls.\n  trees(kit, seed, y, sc, cls) {\n    const r = kit.rng(seed); let one = '';\n    for (let x = 40; x < 1920; x += 220 + r() * 260) {\n      const s = sc * (0.8 + r() * 0.4);\n      one += '<g transform=\"translate(' + x.toFixed(0) + ' ' + y + ') scale(' + s.toFixed(2) + ')\"><rect x=\"-9\" y=\"-70\" width=\"18\" height=\"70\" style=\"fill:var(--trunk)\"/><circle cy=\"-110\" r=\"62\" style=\"fill:var(--grass2)\"/><circle cx=\"-22\" cy=\"-124\" r=\"34\" style=\"fill:var(--grass)\"/><\/g>';\n    }\n    return '<g class=\"' + cls + '\"><g>' + one + '<\/g><g transform=\"translate(1920 0)\">' + one + '<\/g><\/g>';\n  },\n  clouds(kit, seed, cls) {\n    const r = kit.rng(seed); let one = '';\n    for (let i = 0; i < 4; i++) {\n      const x = 120 + i * 480 + r() * 160, y = 110 + r() * 170, s = 0.7 + r() * 0.6;\n      one += '<g transform=\"translate(' + x.toFixed(0) + ' ' + y.toFixed(0) + ') scale(' + s.toFixed(2) + ')\" style=\"fill:var(--cloud)\"><ellipse rx=\"110\" ry=\"34\"/><circle cx=\"-36\" cy=\"-22\" r=\"42\"/><circle cx=\"30\" cy=\"-34\" r=\"54\"/><\/g>';\n    }\n    return '<g class=\"' + cls + '\"><g>' + one + '<\/g><g transform=\"translate(1920 0)\">' + one + '<\/g><\/g>';\n  },\n  // Grass and a road; the road's dashes sit in their own group so a scene can scroll them.\n  road(cls) {\n    let dash = '';\n    for (let x = 0; x < 2200; x += 180) dash += '<rect x=\"' + x + '\" y=\"930\" width=\"90\" height=\"12\" rx=\"6\" style=\"fill:var(--accent)\"/>';\n    return '<rect y=\"820\" width=\"1920\" height=\"260\" style=\"fill:var(--grass)\"/><rect y=\"876\" width=\"1920\" height=\"118\" style=\"fill:var(--road)\"/><g class=\"' + cls + '\">' + dash + '<\/g>';\n  },\n  // A whole bike, rear axle at (0,0), facing right. set(wheelDeg, crankDeg).\n  bike(cls) {\n    const BB = [220, 25], tube = 'fill:none;stroke:var(--main);stroke-width:16;stroke-linecap:round;stroke-linejoin:round';\n    const markup = '<g class=\"' + cls + '\">' +\n      '<g class=\"' + cls + '-rw\">' + W.wheel(cls + '-tyre-r', 150) + '<\/g>' +\n      '<g transform=\"translate(530 0)\"><g class=\"' + cls + '-fw\">' + W.wheel(cls + '-tyre-f', 150) + '<\/g><\/g>' +\n      '<path d=\"M0 0 L220 25 L175 -205 Z M175 -205 L450 -205 M220 25 L465 -165 M450 -215 L465 -165 L530 0\" style=\"' + tube + '\"/>' +\n      '<path d=\"M450 -215 L444 -248 L398 -256\" style=\"fill:none;stroke:var(--tire);stroke-width:14;stroke-linecap:round;stroke-linejoin:round\"/>' +\n      '<path d=\"M175 -205 L166 -240\" style=\"stroke:var(--steel);stroke-width:12\"/><path d=\"M118 -250 Q160 -264 214 -248 Q166 -234 118 -250 Z\" style=\"fill:var(--tire)\"/>' +\n      '<g class=\"' + cls + '-cog\">' + W.gear(cls + '-cog-g', 18, 12, 'var(--metal)', false) + '<\/g>' +\n      '<path class=\"' + cls + '-chain\" d=\"' + W.chain(0, 0, 18, BB[0], BB[1], 40) + '\" style=\"fill:none;stroke:var(--second);stroke-width:6;stroke-dasharray:8 5\"/>' +\n      '<g transform=\"translate(220 25)\"><g class=\"' + cls + '-ring\">' + W.gear(cls + '-ring-g', 40, 26, 'var(--metal)', false) +\n      '<rect x=\"-10\" y=\"-10\" width=\"92\" height=\"20\" rx=\"10\" style=\"fill:var(--second)\"/><\/g>' +\n      '<g class=\"' + cls + '-pedal\"><rect x=\"-28\" y=\"-9\" width=\"56\" height=\"18\" rx=\"5\" style=\"fill:var(--tire)\"/><\/g><\/g><\/g>';\n    let el = {};\n    return {\n      markup,\n      bind(root) { const q = (s) => root.querySelector('.' + cls + s); el = { rw: q('-rw'), fw: q('-fw'), cog: q('-cog'), ring: q('-ring'), pedal: q('-pedal'), chain: q('-chain') }; },\n      set(wa, ca) {\n        el.rw.setAttr   eio: (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; },
  eob: (x, s = 1.4) => { x = clamp01(x) - 1; return 1 + (s + 1) * x * x * x + s * x * x; },
  rng(seed) { let a = (seed * 2654435761) >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; },
  h(html) { const tp = document.createElement('template'); tp.innerHTML = html.trim(); return tp.content.firstElementChild; },
  W: 1920, H: 1080,
  TextFx: { fadeFromRight(el, t, t0, o = {}) {
    if (!el._w) { const words = el.textContent.split(' '); el.textContent = ''; el._w = words.map((w, i) => { const s = document.createElement('span'); s.textContent = w; s.style.display = 'inline-block'; el.append(s); if (i < words.length - 1) el.append(' '); return s; }); }
    const st = o.stagger ?? 0.11, d = o.dur ?? 0.5, dx = o.dx ?? 30;
    el._w.forEach((s, i) => { const p = K.eo(K.seg(t, t0 + i * st, t0 + i * st + d)); s.style.opacity = p; s.style.transform = 'translateX(' + ((1 - p) * dx).toFixed(1) + 'px)'; });
  } },
};
const stage = document.getElementById('stage'), screen = document.getElementById('screen');
const defs = {}, list = [];
new Function('kit', DATA.shared)(K);
// Árboles y nubes de bloques, en lugar de los redondos.
W.trees = function (kit, seed, y, sc, cls) {
  const r = kit.rng(seed); let one = '';
  for (let x = 40; x < 1920; x += 220 + r() * 260) {
    const s = sc * (0.8 + r() * 0.4);
    one += '<g transform="translate(' + x.toFixed(0) + ' ' + y + ') scale(' + s.toFixed(2) + ')"><rect x="-12" y="-80" width="24" height="80" style="fill:var(--trunk)"/>' +
      '<rect x="-70" y="-200" width="140" height="130" style="fill:var(--grass2)"/><rect x="-50" y="-230" width="100" height="40" style="fill:var(--grass2)"/>' +
      '<rect x="-50" y="-190" width="40" height="40" style="fill:var(--grass)"/><rect x="20" y="-140" width="30" height="30" style="fill:var(--grass)"/></g>';
  }
  return '<g class="' + cls + '"><g>' + one + '</g><g transform="translate(1920 0)">' + one + '</g></g>';
};
W.clouds = function (kit, seed, cls) {
  const r = kit.rng(seed); let one = '';
  for (let i = 0; i < 4; i++) {
    const x = 120 + i * 480 + r() * 160, y = 110 + r() * 170, s = 0.7 + r() * 0.6;
    one += '<g transform="translate(' + x.toFixed(0) + ' ' + y.toFixed(0) + ') scale(' + s.toFixed(2) + ')" style="fill:var(--cloud)"><rect x="-120" y="-30" width="240" height="60"/><rect x="-60" y="-70" width="130" height="40"/></g>';
  }
  return '<g class="' + cls + '"><g>' + one + '</g><g transform="translate(1920 0)">' + one + '</g></g>';
};

let start = 0;
for (const s of DATA.scenes) {
  const div = document.createElement('div'); div.className = 'sc'; div.hidden = true; stage.append(div);
  const kit = Object.assign({}, K, { stage: div, dur: s.dur, start, scene(id, def) { defs[id] = def; } });
  new Function('kit', DATA.mods[s.id])(kit);
  list.push({ id: s.id, start, dur: s.dur, div, kit }); start += s.dur;
}
const TOTAL = start;
for (const sc of list) { const d = defs[sc.id]; if (d.init) d.init(sc.kit); }
function fit() { stage.style.transform = 'scale(' + (screen.clientWidth / 1920) + ')'; }
addEventListener('resize', fit); fit();
let shown = null;
function draw(t) {
  t = Math.max(0, Math.min(TOTAL - 1e-3, t));
  const sc = list.find((s) => t < s.start + s.dur) || list[list.length - 1];
  if (shown !== sc) { if (shown) shown.div.hidden = true; sc.div.hidden = false; shown = sc; }
  defs[sc.id].render.call(defs[sc.id], t - sc.start, sc.kit);
  const f = (x) => Math.floor(x / 60) + ':' + String(Math.floor(x % 60)).padStart(2, '0');
  document.getElementById('time').textContent = f(t) + ' / ' + f(TOTAL);
  document.getElementById('seek').value = t;
}
const voice = document.getElementById('voice'), big = document.getElementById('big'), play = document.getElementById('play'), seek = document.getElementById('seek');
seek.max = TOTAL;
function setBtn(on) { play.textContent = on ? '❚❚' : '▶'; play.setAttribute('aria-label', on ? 'Pausar' : 'Reproducir'); big.hidden = on; }
function toggle() {
  if (voice.paused) { if (voice.currentTime >= TOTAL - 0.05) voice.currentTime = 0; voice.play().catch(() => {}); } else voice.pause();
}
play.onclick = toggle; big.onclick = (e) => { e.stopPropagation(); toggle(); }; screen.onclick = toggle;
voice.onplay = () => setBtn(true); voice.onpause = () => setBtn(false);
voice.onended = () => { setBtn(false); draw(TOTAL); };
seek.oninput = () => { voice.currentTime = +seek.value; draw(+seek.value); };
(function loop() { if (!voice.paused) draw(voice.currentTime); requestAnimationFrame(loop); })();
draw(0.6);
</script>
