<title>Los Cambios de la Bici</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Shantell+Sans:wght@400;700&display=swap">
<style>
/* Layout: the 16:9 film fills the width, controls sit under it. */
:root { --page:#E9F5FA; --ink:#1D2B3A; --dim:#4A5B6B; --btn:#E8483B; --btnInk:#ffffff; --track:#BFD3DD; --frame:#1D2B3A }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page:#0F1820; --ink:#E6F0F5; --dim:#9DB0BE; --btn:#E8483B; --btnInk:#ffffff; --track:#2C3B48; --frame:#000000; color-scheme:dark } }
:root[data-theme="dark"] { --page:#0F1820; --ink:#E6F0F5; --dim:#9DB0BE; --btn:#E8483B; --btnInk:#ffffff; --track:#2C3B48; --frame:#000000; color-scheme:dark }
html, body { background:var(--page); color:var(--ink) }
body { font-family:"Nunito", system-ui, sans-serif; padding-block:20px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:14px }
h1 { margin:0; font-family:"Shantell Sans", "Nunito", sans-serif; font-size:clamp(22px, 4vw, 32px); text-wrap:balance }
.screen { position:relative; width:100%; aspect-ratio:16/9; max-width:100%; overflow:hidden; border-radius:14px; background:var(--frame); cursor:pointer }
#stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden; --display:"Shantell Sans", "Nunito", cursive; --sans:"Nunito", system-ui, sans-serif }
#stage > .sc { position:absolute; inset:0 }
.big { position:absolute; inset:0; margin:auto; width:110px; height:110px; border-radius:50%; border:0; background:var(--btn); color:var(--btnInk); font-size:44px; box-shadow:0 6px 24px rgba(0,0,0,.3); cursor:pointer }
.bar { display:flex; align-items:center; gap:12px }
.bar button { flex:none; min-width:48px; height:48px; border-radius:24px; border:0; background:var(--btn); color:var(--btnInk); font:800 18px "Nunito", sans-serif; padding:0 16px; cursor:pointer }
.bar input { flex:1; min-width:0; accent-color:var(--btn) }
.time { font-variant-numeric:tabular-nums; color:var(--dim); font-weight:700; min-width:88px; text-align:right }
button:focus-visible, input:focus-visible { outline:3px solid var(--ink); outline-offset:2px }
p.note { margin:0; color:var(--dim); font-size:15px; max-width:65ch }
#stage { --ground:#BFE6F5; --main:#E8483B; --second:#1D2B3A; --accent:#FFC93C; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }
#stage { --far:color-mix(in srgb, var(--ground) 70%, var(--second)); --grass:color-mix(in srgb, color-mix(in srgb, var(--ground) 45%, var(--accent)) 74%, var(--second)); --grass2:color-mix(in srgb, var(--grass) 78%, var(--second)); --road:color-mix(in srgb, var(--second) 72%, var(--ground));
  --steel:color-mix(in srgb, var(--second) 62%, var(--ground)); --metal:color-mix(in srgb, var(--ground) 70%, var(--second)); --metal2:color-mix(in srgb, var(--ground) 50%, var(--second)); --tire:color-mix(in srgb, var(--second) 92%, var(--main));
  --cloud:color-mix(in srgb, var(--ground) 28%, #ffffff); --card:color-mix(in srgb, var(--ground) 30%, #ffffff); --trunk:color-mix(in srgb, var(--main) 45%, var(--second)) }
.ground { position:absolute; inset:0; background:var(--ground) }
.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:20px } .words > * { margin:0 }
.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:96px; line-height:1.08; font-weight:700 } .sub { font-size:56px; line-height:1.2; font-weight:700 }
.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }
.air { position:absolute; inset:0; background:linear-gradient(color-mix(in srgb, var(--ground) 82%, var(--second)), var(--ground) 70%) }
.band { left:0; right:0; bottom:0; padding:34px 110px 50px; background:var(--card); border-top:10px solid var(--accent); gap:10px }
.band .sub { font-size:58px } .band .em { color:var(--main) }
.tag { position:absolute; padding:10px 28px; border-radius:40px; background:var(--card); border:5px solid var(--second); font-size:46px; font-weight:800; line-height:1.15 }
.count { position:absolute; right:80px; top:70px; width:430px; padding:26px 36px; background:var(--card); border-radius:28px; border:5px solid var(--second); display:flex; flex-direction:column; gap:14px }
.count .row { display:flex; justify-content:space-between; align-items:center; gap:20px; font-size:42px; font-weight:800 }
.count .n { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:88px; line-height:1; color:var(--main); font-variant-numeric:tabular-nums; font-weight:700 }
</style>
<div class="wrap">
  <h1>¿Cómo funcionan los cambios de la bici?</h1>
  <div class="screen" id="screen"><div id="stage"></div><button class="big" id="big" aria-label="Reproducir">▶</button></div>
  <div class="bar">
    <button id="play" aria-label="Reproducir">▶</button>
    <input id="seek" type="range" min="0" max="30" step="0.01" value="0" aria-label="Avanzar o retroceder">
    <span class="time" id="time">0:00 / 0:30</span>
  </div>
  <p class="note">Con voz. Toca ▶ para verla con sonido.</p>
</div>

 width=\"' + (r * 0.18).toFixed(1) + '\" height=\"' + (r * 0.74).toFixed(1) + '\" rx=\"6\" transform=\"rotate(' + (i * 72) + ')\" style=\"fill:' + fill + ';stroke:var(--second);stroke-width:3\"/>';\n    }\n    return s + '<circle r=\"' + Math.max(8, r * 0.2).toFixed(1) + '\" style=\"fill:var(--steel);stroke:var(--second);stroke-width:4\"/><\/g>';\n  },\n  // A spoked wheel centred on (0,0), with a yellow reflector so you can count its turns.\n  wheel(cls, R) {\n    const k = R / 150; let s = '<g class=\"' + cls + '\">';\n    s += '<circle r=\"' + (R - 12 * k) + '\" style=\"fill:none;stroke:var(--tire);stroke-width:' + (24 * k) + '\"/>';\n    s += '<circle r=\"' + (R - 27 * k) + '\" style=\"fill:none;stroke:var(--steel);stroke-width:' + (6 * k) + '\"/>';\n    for (let i = 0; i < 16; i++) {\n      const a = i * Math.PI / 8;\n      s += '<line x1=\"' + (14 * k * Math.cos(a)).toFixed(1) + '\" y1=\"' + (14 * k * Math.sin(a)).toFixed(1) + '\" x2=\"' + ((R - 28 * k) * Math.cos(a)).toFixed(1) + '\" y2=\"' + ((R - 28 * k) * Math.sin(a)).toFixed(1) + '\" style=\"stroke:var(--steel);stroke-width:' + (2.5 * k) + '\"/>';\n    }\n    s += '<rect x=\"' + (-9 * k) + '\" y=\"' + (-R * 0.66 - 15 * k) + '\" width=\"' + (18 * k) + '\" height=\"' + (30 * k) + '\" rx=\"' + (4 * k) + '\" style=\"fill:var(--accent);stroke:var(--second);stroke-width:' + (3 * k) + '\"/>';\n    return s + '<circle r=\"' + (18 * k) + '\" style=\"fill:var(--steel);stroke:var(--second);stroke-width:' + (3 * k) + '\"/><\/g>';\n  },\n  // The loop of chain around two gears (rear first), as one path that runs clockwise.\n  chain(x1, y1, r1, x2, y2, r2) {\n    const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy), th = Math.atan2(dy, dx), ph = Math.asin((r1 - r2) / d);\n    const at = th - Math.PI / 2 + ph, ab = th + Math.PI / 2 - ph;\n    const p = (x, y, r, a) => (x + r * Math.cos(a)).toFixed(1) + ' ' + (y + r * Math.sin(a)).toFixed(1);\n    return 'M' + p(x1, y1, r1, at) + ' L' + p(x2, y2, r2, at) + ' A' + r2 + ' ' + r2 + ' 0 ' + (r2 > r1 ? 1 : 0) + ' 1 ' + p(x2, y2, r2, ab) + ' L' + p(x1, y1, r1, ab) + ' A' + r1 + ' ' + r1 + ' 0 ' + (r1 > r2 ? 1 : 0) + ' 1 ' + p(x1, y1, r1, at) + 'Z';\n  },\n  hills() {\n    return '<path class=\"hills\" d=\"M0 650 Q260 520 620 600 T1300 570 T1920 545 V900 H0 Z\" style=\"fill:var(--far)\"/>';\n  },\n  // A row of round trees, drawn twice side by side so it can loop as it scrolls.\n  trees(kit, seed, y, sc, cls) {\n    const r = kit.rng(seed); let one = '';\n    for (let x = 40; x < 1920; x += 220 + r() * 260) {\n      const s = sc * (0.8 + r() * 0.4);\n      one += '<g transform=\"translate(' + x.toFixed(0) + ' ' + y + ') scale(' + s.toFixed(2) + ')\"><rect x=\"-9\" y=\"-70\" width=\"18\" height=\"70\" style=\"fill:var(--trunk)\"/><circle cy=\"-110\" r=\"62\" style=\"fill:var(--grass2)\"/><circle cx=\"-22\" cy=\"-124\" r=\"34\" style=\"fill:var(--grass)\"/><\/g>';\n    }\n    return '<g class=\"' + cls + '\"><g>' + one + '<\/g><g transform=\"translate(1920 0)\">' + one + '<\/g><\/g>';\n  },\n  clouds(kit, seed, cls) {\n    const r = kit.rng(seed); let one = '';\n    for (let i = 0; i < 4; i++) {\n      const x = 120 + i * 480 + r() * 160, y = 110 + r() * 170, s = 0.7 + r() * 0.6;\n      one += '<g transform=\"translate(' + x.toFixed(0) + ' ' + y.toFixed(0) + ') scale(' + s.toFixed(2) + ')\" style=\"fill:var(--cloud)\"><ellipse rx=\"110\" ry=\"34\"/><circle cx=\"-36\" cy=\"-22\" r=\"42\"/><circle cx=\"30\" cy=\"-34\" r=\"54\"/><\/g>';\n    }\n    return '<g class=\"' + cls + '\"><g>' + one + '<\/g><g transform=\"translate(1920 0)\">' + one + '<\/g><\/g>';\n  },\n  // Grass and a road; the road's dashes sit in their own group so a scene can scroll them.\n  road(cls) {\n    let dash = '';\n    for (let x = 0; x < 2200; x += 180) dash += '<rect x=\"' + x + '\" y=\"930\" width=\"90\" height=\"12\" rx=\"6\" style=\"fill:var(--accent)\"/>';\n    return '<rect y=\"820\" width=\"1920\" height=\"260\" style=\"fill:var(--grass)\"/><rect y=\"876\" width=\"1920\" height=\"118\" style=\"fill:var(--road)\"/><g class=\"' + cls + '\">' + dash + '<\/g>';\n  },\n  // A whole bike, rear axle at (0,0), facing right. set(wheelDeg, crankDeg).\n  bike(cls) {\n    const BB = [220, 25], tube = 'fill:none;stroke:var(--main);stroke-width:16;stroke-linecap:round;stroke-linejoin:round';\n    const markup = '<g class=\"' + cls + '\">' +\n      '<g class=\"' + cls + '-rw\">' + W.wheel(cls + '-tyre-r', 150) + '<\/g>' +\n      '<g transform=\"translate(530 0)\"><g class=\"' + cls + '-fw\">' + W.wheel(cls + '-tyre-f', 150) + '<\/g><\/g>' +\n      '<path d=\"M0 0 L220 25 L175 -205 Z M175 -205 L450 -205 M220 25 L465 -165 M450 -215 L465 -165 L530 0\" style=\"' + tube + '\"/>' +\n      '<path d=\"M450 -215 L444 -248 L398 -256\" style=\"fill:none;stroke:var(--tire);stroke-width:14;stroke-linecap:round;stroke-linejoin:round\"/>' +\n      '<path d=\"M175 -205 L166 -240\" style=\"stroke:var(--steel);stroke-width:12\"/><path d=\"M118 -250 Q160 -264 214 -248 Q166 -234 118 -250 Z\" style=\"fill:var(--tire)\"/>' +\n      '<g class=\"' + cls + '-cog\">' + W.gear(cls + '-cog-g', 18, 12, 'var(--metal)', false) + '<\/g>' +\n      '<path class=\"' + cls + '-chain\" d=\"' + W.chain(0, 0, 18, BB[0], BB[1], 40) + '\" style=\"fill:none;stroke:var(--second);stroke-width:6;stroke-dasharray:8 5\"/>' +\n      '<g transform=\"translate(220 25)\"><g class=\"' + cls + '-ring\">' + W.gear(cls + '-ring-g', 40, 26, 'var(--metal)', false) +\n      '<rect x=\"-10\" y=\"-10\" width=\"92\" height=\"20\" rx=\"10\" style=\"fill:var(--second)\"/><\/g>' +\n      '<g class=\"' + cls + '-pedal\"><rect x=\"-28\" y=\"-9\" width=\"56\" height=\"18\" rx=\"5\" style=\"fill:var(--tire)\"/><\/g><\/g><\/g>';\n    let el = {};\n    return {\n      markup,\n      bind(root) { const q = (s) => root.querySelector('.' + cls + s); el = { rw: q('-rw'), fw: q('-fw'), cog: q('-cog'), ring: q('-ring'), pedal: q('-pedal'), chain: q('-chain') }; },\n      set(wa, ca) {\n        el.rw.setAttribute('transform', 'rotate(' + wa.toFixed(2) + ')');\n        el.fw.setAttribute('transform', 'rotate(' + wa.toFixed(2) + ')');\n        el.cog.setAttribute('transform', 'rotate(' + wa.toFixed(2) + ')');\n        el.ring.setAttribute('transform', 'rotate(' + ca.toFixed(2) + ')');\n        const a = ca * Math.PI / 180;\n        el.pedal.setAttribute('transform', 'translate(' + (82 * Math.cos(a)).toFixed(1) + ' ' + (82 * Math.sin(a)).toFixed(1) + ')');\n        el.chain.style.strokeDashoffset = (-a * 40).toFixed(1);\n      },\n    };\n  },\n  // The close-up drivetrain: wheel and cassette at the rear, chainring and crank at the front.\n  // set(pedalDeg, rearRadius, wheelDeg?)\n  drive(o) {\n    const { rx, ry, fx, fy, fr, cogs, R, crank } = o, tube = 'fill:none;stroke:var(--main);stroke-width:46;stroke-linecap:round';\n    let cas = '';\n    cogs.slice().sort((a, b) => b - a).forEach((r, i) => { cas += W.gear('drive-cog', r, Math.round(r / 4), i % 2 ? 'var(--metal2)' : 'var(--metal)', false); });\n    const markup = '<g class=\"drive\">' +\n      '<g transform=\"translate(' + rx + ' ' + ry + ')\"><g class=\"drive-wrot\">' + W.wheel('drive-tyre', R) + '<\/g><\/g>' +\n      '<path class=\"drive-frame\" d=\"M' + rx + ' ' + ry + ' L' + fx + ' ' + fy + ' M' + rx + ' ' + ry + ' L' + (rx + 330) + ' ' + (ry - 620) + ' M' + fx + ' ' + fy + ' L' + (fx - 170) + ' ' + (fy - 720) + ' M' + fx + ' ' + fy + ' L' + (fx + 760) + ' ' + (fy - 600) + '\" style=\"' + tube + '\"/>' +\n      '<g transform=\"translate(' + rx + ' ' + ry + ')\"><g class=\"drive-cassette\">' + cas + '<\/g><circle class=\"drive-hi\" r=\"' + cogs[0] + '\" style=\"fill:none;stroke:var(--accent);stroke-width:12\"/><\/g>' +\n      '<path class=\"drive-chainb\" style=\"fill:none;stroke:var(--second);stroke-width:24\"/>' +\n      '<path class=\"drive-chain\" style=\"fill:none;stroke:var(--steel);stroke-width:10;stroke-dasharray:15 11\"/>' +\n      '<g transform=\"translate(' + fx + ' ' + fy + ')\"><g class=\"drive-ring\">' + W.gear('drive-ring-g', fr, Math.round(fr / 4), 'var(--metal)', true) +\n      '<rect x=\"-24\" y=\"-24\" width=\"' + (crank + 48) + '\" height=\"48\" rx=\"24\" style=\"fill:var(--second)\"/><circle r=\"16\" style=\"fill:var(--steel)\"/><\/g><\/g>' +\n      '<g class=\"drive-pedal\"><rect x=\"-66\" y=\"-22\" width=\"132\" height=\"44\" rx=\"12\" style=\"fill:var(--tire)\"/><rect x=\"-54\" y=\"-6\" width=\"108\" height=\"12\" rx=\"6\" style=\"fill:var(--accent)\"/><\/g><\/g>';\n    let el = {};\n    return {\n      markup,\n      bind(root) { const q = (s) => root.querySelector('.drive-' + s); el = { w: q('wrot'), c: q('cassette'), hi: q('hi'), cb: q('chainb'), ch: q('chain'), ring: q('ring'), pedal: q('pedal') }; },\n      set(af, rr, ra) {\n        if (ra === undefined) ra = af * fr / rr;\n        el.w.setAttribute('transform', 'rotate(' + ra.toFixed(2) + ')');\n        el.c.setAttribute('transform', 'rotate(' + ra.toFixed(2) + ')');\n        el.ring.setAttribute('transform', 'rotate(' + af.toFixed(2) + ')');\n        el.hi.setAttribute('r', rr.toFixed(1));\n        const d = W.chain(rx, ry, rr, fx, fy, fr), a = af * Math.PI / 180;\n        el.cb.setAttribute('d', d); el.ch.setAttribute('d', d);\n        el.ch.style.strokeDashoffset = (-a * fr).toFixed(1);\n        el.pedal.setAttribute('transform', 'translate(' + (fx + crank * Math.cos(a)).toFixed(1) + ' ' + (fy + crank * Math.sin(a)).toFixed(1) + ')');\n      },\n    };\n  },\n  // The close-up layout every drivetrain scene uses.\n  DRIVE: { rx: 520, ry: 470, fx: 1200, fy: 500, fr: 144, cogs: [144, 128, 108, 88, 72, 60, 48], R: 400, crank: 180 },\n};", "mods": {"intro": "const { seg, eo, eio, lerp, TextFx } = kit;\nkit.scene('intro', {\n  init(kit) {\n    this.bike = W.bike('intro-bike');\n    kit.stage.append(kit.h('<div class=\"ground\"><div class=\"air\"><\/div>' +\n      '<svg class=\"art intro-far\" viewBox=\"0 0 1920 1080\">' + W.clouds(kit, 3, 'intro-clouds') + W.hills() + W.trees(kit, 5, 830, 1, 'intro-trees') + '<\/svg>' +\n      '<svg class=\"art intro-mid\" viewBox=\"0 0 1920 1080\">' + W.road('intro-dash') +\n        '<ellipse class=\"intro-shadow\" cx=\"0\" cy=\"902\" rx=\"470\" ry=\"14\" style=\"fill:color-mix(in srgb, var(--second) 30%, transparent)\"/>' +\n        '<g class=\"intro-pos\">' + this.bike.markup + '<\/g><\/svg>' +\n      '<div class=\"words\" style=\"left:110px;top:80px;width:1700px\"><h1 class=\"line intro-title\">\u00bfC\u00f3mo funcionan los cambios de la bici?<\/h1><\/div><\/div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.bike.bind(q('.intro-pos'));\n    Object.assign(this, { pos: q('.intro-pos'), sh: q('.intro-shadow'), clouds: q('.intro-clouds'), far: q('.intro-far'), mid: q('.intro-mid'), title: q('.intro-title') });\n  },\n  render(t) {\n    const roll = eo(seg(t, -0.6, 2.6)), bx = lerp(-260, 330, roll) + 10 * Math.max(0, t - 2.6);\n    const k = 1.3, dist = bx + 260;\n    const wa = dist / (150 * k) * 180 / Math.PI;\n    this.pos.setAttribute('transform', 'translate(' + bx.toFixed(1) + ' 705) scale(' + k + ')');\n    this.sh.setAttribute('cx', (bx + 265 * k).toFixed(1));\n    this.bike.set(wa, wa * 18 / 40);\n    this.clouds.setAttribute('transform', 'translate(' + (-18 * t).toFixed(1) + ' 0)');\n    const push = eio(seg(t, 0, 3.5));\n    this.far.style.transform = 'scale(' + lerp(1, 1.015, push) + ')';\n    this.mid.style.transform = 'scale(' + lerp(1, 1.03, push) + ')';\n    TextFx.fadeFromRight(this.title, t, -0.4);\n  },\n});", "chain": "const { seg, eo, eob, eio, lerp, clamp01, TextFx } = kit;\nkit.scene('chain', {\n  init(kit) {\n    this.d = W.drive(W.DRIVE);\n    const ptr = 'fill:none;stroke:var(--second);stroke-width:5;stroke-linecap:round';\n    kit.stage.append(kit.h('<div class=\"ground\"><div class=\"air\"><\/div>' +\n      '<svg class=\"art chain-art\" viewBox=\"0 0 1920 1080\">' + this.d.markup +\n        '<g class=\"chain-ptrs\"><path class=\"chain-p0\" d=\"M1478 478 L1352 494\" style=\"' + ptr + '\"/><path class=\"chain-p1\" d=\"M870 326 L870 372\" style=\"' + ptr + '\"/><path class=\"chain-p2\" d=\"M420 298 L470 380\" style=\"' + ptr + '\"/><\/g><\/svg>' +\n      '<div class=\"tag chain-t0\" style=\"left:1480px;top:440px\">Plato<\/div>' +\n      '<div class=\"tag chain-t1\" style=\"left:770px;top:250px\">Cadena<\/div>' +\n      '<div class=\"tag chain-t2\" style=\"left:300px;top:222px\">Pi\u00f1\u00f3n<\/div>' +\n      '<div class=\"words band\"><p class=\"sub chain-l1\">Los pedales hacen girar el plato.<\/p><p class=\"sub chain-l2\">La cadena tira del pi\u00f1\u00f3n\u2026 \u00a1y la rueda gira!<\/p><\/div><\/div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.d.bind(q('.chain-art'));\n    this.tags = [0, 1, 2].map((i) => ({ tag: q('.chain-t' + i), ptr: q('.chain-p' + i), at: 1 + i * 0.9 }));\n    Object.assign(this, { art: q('.chain-art'), l1: q('.chain-l1'), l2: q('.chain-l2') });\n  },\n  render(t) {\n    const af = 80 * t + 20;\n    this.d.set(af, 72);\n    this.art.style.transform = 'scale(' + lerp(1, 1.03, eio(seg(t, 0, 6))) + ')';\n    for (const g of this.tags) {\n      const p = seg(t, g.at, g.at + 0.45);\n      g.tag.style.opacity = clamp01(p * 3);\n      g.tag.style.transform = 'scale(' + (p > 0 ? eob(p, 1.7) : 0).toFixed(3) + ') rotate(' + (2 * Math.sin(t * 1.7 + g.at)).toFixed(2) + 'deg)';\n      g.ptr.style.opacity = eo(seg(t, g.at + 0.2, g.at + 0.6));\n    }\n    TextFx.fadeFromRight(this.l1, t, 0.3);\n    TextFx.fadeFromRight(this.l2, t, 2.2);\n  },\n});", "easy": "const { seg, eo, eio, lerp, TextFx } = kit;\nObject.assign(W, {\n  // The turn counter: two rows, pedal and wheel. Pure from the two angles.\n  counter(cls) {\n    return '<div class=\"count ' + cls + '\"><div class=\"row\"><span>Vueltas del pedal<\/span><span class=\"n ' + cls + '-p\">0<\/span><\/div><div class=\"row\"><span>Vueltas de la rueda<\/span><span class=\"n ' + cls + '-w\">0<\/span><\/div><\/div>';\n  },\n  setCount(el, deg) {\n    const n = Math.floor(deg / 360 + 1e-6), past = deg - n * 360;\n    el.textContent = String(n);\n    el.style.transform = 'scale(' + (n > 0 && past < 40 ? 1 + 0.35 * (1 - past / 40) : 1).toFixed(3) + ')';\n  },\n});\nkit.scene('easy', {\n  init(kit) {\n    this.d = W.drive(W.DRIVE);\n    kit.stage.append(kit.h('<div class=\"ground\"><div class=\"air\"><\/div>' +\n      '<svg class=\"art easy-art\" viewBox=\"0 0 1920 1080\">' + this.d.markup + '<\/svg>' + W.counter('easy-count') +\n      '<div class=\"words band\"><p class=\"sub easy-l1\">Pi\u00f1\u00f3n grande: pedaleas suave y la rueda va despacio.<\/p><p class=\"sub easy-l2\">\u00a1Ideal para subir cerros!<\/p><\/div><\/div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.d.bind(q('.easy-art'));\n    Object.assign(this, { art: q('.easy-art'), box: q('.easy-count'), np: q('.easy-count-p'), nw: q('.easy-count-w'), l1: q('.easy-l1'), l2: q('.easy-l2') });\n  },\n  render(t) {\n    const af = 360 * eio(seg(t, 0.9, 3.9)) + 18 * Math.max(0, t - 4.3);\n    this.d.set(af, 144);\n    W.setCount(this.np, af);\n    W.setCount(this.nw, af);\n    this.art.style.transform = 'scale(' + lerp(1.04, 1.0, eio(seg(t, 0, 6))) + ')';\n    this.box.style.opacity = eo(seg(t, 0.2, 0.7));\n    this.box.style.transform = 'translateY(' + lerp(-30, 0, eo(seg(t, 0.2, 0.7))).toFixed(1) + 'px)';\n    TextFx.fadeFromRight(this.l1, t, 0.3);\n    TextFx.fadeFromRight(this.l2, t, 3.6);\n  },\n});", "fast": "const { seg, eo, eio, lerp, TextFx } = kit;\nkit.scene('fast', {\n  init(kit) {\n    this.d = W.drive(W.DRIVE);\n    kit.stage.append(kit.h('<div class=\"ground\"><div class=\"air\"><\/div>' +\n      '<svg class=\"art fast-art\" viewBox=\"0 0 1920 1080\">' + this.d.markup + '<\/svg>' + W.counter('fast-count') +\n      '<div class=\"words band\"><p class=\"sub fast-l1\">Pi\u00f1\u00f3n chico: cuesta m\u00e1s pedalear\u2026<\/p><p class=\"sub fast-l2\">\u2026pero la rueda da 3 vueltas. \u00a1Vas rapid\u00edsimo!<\/p><\/div><\/div>'));\n    const q const stage = document.getElementById('stage'), screen = document.getElementById('screen');

function setBtn(on) { play.textContent = on ? '❚❚' : '▶'; play.setAttribute('aria-label', on ? 'Pausar' : 'Reproducir'); big.hidden = on; }
